name: CI/CD Pipeline - DevOps Final

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v4

    - name: Configurar Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Linter (flake8)
      run: flake8 .

    - name: Testes unitários e de integração (pytest + cobertura)
      run: python -m pytest -v --cov=. --cov-report=term-missing

    - name: Executar migrações do banco (Alembic)
      run: python -m alembic upgrade head

    - name: Simular execução do main.py
      run: python main.py

    - name: Verificar resultado ponta a ponta (10 registros, 7 aprovados, 3 rejeitados)
      run: |
        python - <<'PY'
        import sqlite3
        c = sqlite3.connect("sistema.db")
        total = c.execute("SELECT COUNT(*) FROM transacoes").fetchone()[0]
        aprov = c.execute("SELECT COUNT(*) FROM transacoes WHERE status='APROVADO'").fetchone()[0]
        rej = c.execute("SELECT COUNT(*) FROM transacoes WHERE status='REJEITADO'").fetchone()[0]
        print(total, aprov, rej)
        assert (total, aprov, rej) == (10, 7, 3), "Resultado inesperado do processamento em lote"
        PY

    - name: Publicar app.log como artefato
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: app-log
        path: app.log
        if-no-files-found: ignore
